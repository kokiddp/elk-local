name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string for packaged artifacts. Defaults to the tag name or git describe output.
        required: false
        type: string
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build distribution packages
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/release/build_dist.sh

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elk-local-release-artifacts
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.zip
            dist/releases/sha256sum.txt

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/*.tar.gz
            dist/releases/*.zip
            dist/releases/sha256sum.txt